<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>One Command Assembler</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script src="editor.js"></script>
</head>

<body>

  <div id="topbar">
    <div class="left">
      <div class="title">One Command Assembler</div>

      <button id="convertBtn">Convert</button>

      <button id="backBtn" style="display: none;">
        Back
      </button>
    </div>
  </div>

  <div id="container" class="active"></div>

  <div id="outputPage">
    <div id="outputButtons">
      <button id="copyBtn">Copy</button>
    </div>

    <textarea id="outputBox" readonly></textarea>
  </div>

  <script src="main.js"></script>

</body>

</html>
